  - {type: variant, offset: 0, length: 0, content: '', CK-KZ: 九跡交乾履斗隨罡所指以攝精邪戰六天魔鬼奪二十四治改爲福庭名之化宇降其帥爲陰官先時蜀中魔鬼數萬白晝爲市擅行疫癘生民久罹其害自六天大魔摧伏之後陵斥其鬼眾散處西北不毛之地與之爲誓曰人主於晝鬼行於夜陰陽分别各有司存違者正一有法必加誅戮於是幽明異域人鬼殊途今西蜀靑城有鬼市并天師誓鬼碑石天地石日月存焉其誓蓋指此爲納謂天地合日月明乃許汝出也五月一日老君再降授陵以太淸中篇經目九卷金液丹經三十六卷太淸中經室}
